---
type: showroom
default_width: 40
persist_url_state: true
view_switcher:
  enabled: true
  default_mode: split
tabs:
  - name: Terminal
    path: /terminal
    port: 443
  - name: LLM Chat UI
    url: '${chat_ui_url}'
  - name: OpenShift Console
    url: '${openshift_console_url}'
  - name: Agent Sandbox Docs
    url: 'https://docs.redhat.com/en/documentation/openshift_sandboxed_containers/1.13/html/deploying_red_hat_build_of_agent_sandbox/index'
